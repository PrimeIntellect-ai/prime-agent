[workspace]
resolver = "2"
members = [
    "crates/pa-telemetry",
    "crates/pa-types",
    "crates/pa-ai",
    "crates/pa-models",
    "crates/pa-agent",
    "crates/pa-core",
    "crates/pa-daemon",
    "crates/pa-tui",
    "crates/pa-cli",
]

# Crossterm 0.28.1's kitty support check holds the process-wide event reader
# for 2s on terminals that do not answer. Keep its parser/queued input intact,
# but cap the query poll to 250ms (late real-terminal replies still get a chance).
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) so every
# wire/durable JSON surface serializes in construction order — the JS object
# model the TS daemon and session files byte-emit. Without it the Map is a
# BTreeMap and every Value-built frame re-sorts its keys alphabetically,
# diverging from the TS byte stream (e.g. compaction `details` order).
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["attributes"] }
pa-telemetry = { path = "crates/pa-telemetry" }
pa-types = { path = "crates/pa-types" }
pa-ai = { path = "crates/pa-ai" }
pa-agent = { path = "crates/pa-agent" }
thiserror = "2"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"

# Shipping posture, pinned: thin LTO plus 4 codegen units for cross-crate
# inlining in the hot render path. The release strips debug sections
# (lane/hillclimb-binary-size): install bytes drop ~74% on the Linux ELF,
# where DWARF line tables dominate the unstripped image. TRADEOFF, stated
# explicitly: panic backtraces keep the static symbol table (function
# names) but LOSE file:line — strip="debuginfo" removes the .debug_* line
# tables the old debug="line-tables-only" posture shipped for, so that
# line is dead under this posture and is dropped (debug defaults to 0;
# the final image is byte-identical, builds just skip emitting DWARF that
# would be stripped). If offline symbolication is wanted later, restore
# debug, drop strip, and ship the unstripped binary as a split-debug side
# artifact instead (PR discussion). .dynsym survives stripping, so dynamic
# linking and the release GLIBC baseline gate are unaffected. The macOS
# arm64 byte effect is unmeasured: debug info there lives in dSYM
# bundles, not the executable.
[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
