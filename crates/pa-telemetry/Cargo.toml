[package]
name = "pa-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modular telemetry: event schema, queueing, and sinks for Prime Agent."

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["system", "fs"] }

[dev-dependencies]
tempfile = "3"
# The wire tests' client configuration: reqwest builds no client without one
# (the product passes pa-ai's shared builder).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[lints]
workspace = true
