[package]
name = "pa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session engine: tools, skills, prompts, kernel, subagents, settings."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
pa-types.workspace = true
pa-ai.workspace = true
pa-models = { path = "../pa-models" }
pa-agent.workspace = true
pa-telemetry.workspace = true
base64 = "0.22"
fancy-regex = "0.14"
# The traces browser login's auth challenge (RSA-2048 keypair, OAEP-SHA256
# result decrypt; sha2 matches the workspace's version, pem for the SPKI
# wire form).
rsa = { version = "0.9", features = ["sha2", "pem"] }
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "user", "fs", "dir"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
getrandom = "0.3"
url = "2"
hmac = "0.12"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tar = "0.4"
flate2 = "1"
unicode-normalization = "0.1"
serde_yaml = "0.9"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
# The traces rate-gate test runs on paused tokio time (the 12s platform
# interval auto-advances).
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "golden_system_prompt"
path = "tests/golden/system_prompt.rs"

[lints.clippy]
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"
