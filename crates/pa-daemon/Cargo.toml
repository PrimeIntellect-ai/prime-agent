[package]
name = "pa-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session supervisor, worker processes, and wire protocol."

[dependencies]
pa-types = { path = "../pa-types" }
pa-core = { path = "../pa-core" }
pa-agent = { path = "../pa-agent" }
pa-ai = { path = "../pa-ai" }
pa-telemetry = { path = "../pa-telemetry" }
anyhow = { workspace = true }
futures = { workspace = true }
globset = "0.4"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
# The orphan-journal e2e signals and probes process groups directly.
nix = { version = "0.29", features = ["signal", "process"] }
socket2 = "0.6"
# The supervisor property suite draws sibling rosters for the live
# rename ladder; the plain std features are enough (no fork/timeout).
proptest = { workspace = true }
# Test-only: `ModelCatalog::with_urls` + the compiled offline Prime
# Inference entries build the loopback catalog the session-model restore
# tests script (the pa-core tests/common pattern, in-crate), and the
# catalog-repo child-resolution regression writes the layer-A disk cache
# in the pa-models snapshot shape; the crate's runtime surface goes
# through pa-core.
pa-models = { path = "../pa-models" }
url = "2"
# The MCP catalog e2e seeds the fetch lane's snapshot envelope: the real
# catalog url/scope constants keep the seeded cache byte-honest.
# `test-util` (tokio time pause) is test-only: the mutation-drain latch test
# drives real timeouts through the paused clock.
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "pa-daemon"
path = "src/main.rs"

[lints.rust]
# Native Windows log handles require FFI. Keep the rest of this crate
# denied and allow only the private platform module that owns the calls.
unsafe_code = "deny"

[lints.clippy]
# Mirror the workspace warning set while the Rust lint is scoped above.
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"
