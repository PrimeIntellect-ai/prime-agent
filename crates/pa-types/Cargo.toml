[package]
name = "pa-types"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared domain and wire types for Prime Agent."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
socket2 = "0.6"
# The incident classifier's log-message patterns are the TS regexes
# (src/cli/incident.ts); the `regex` crate keeps their semantics 1:1.
regex = "1"
# The TLS trust seam (`tls.rs`): the same rustls + native-root loader the
# reqwest/tungstenite graph pins, so the shared extra-CA ClientConfig is the
# exact type those clients preconfigure (`rustls-native-certs` also
# implements the SSL_CERT_FILE/SSL_CERT_DIR convention).
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
# The tls.rs live-TLS pin: a loopback rustls server (tokio-rustls, the same
# version the reqwest graph carries) plus today's default webpki roots for
# the without-the-var refusal side.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
webpki-roots = "1"

[lints.clippy]
# pa-types keeps its OWN lints table (not `workspace = true`): the
# workspace's `rust.unsafe_code = "forbid"` would outlaw the platform
# bindings' legitimate unsafe blocks. The clippy rows mirror the
# workspace table, and the pedantic class rides here so CI's
# -D warnings bar enforces it on this crate too.
pedantic = "warn"
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
bool_to_int_with_if = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
default_trait_access = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
ignore_without_reason = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_assert = "warn"
manual_assert_eq = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
match_bool = "warn"
match_wildcard_for_single_variants = "warn"
needless_raw_string_hashes = "warn"
no_effect_underscore_binding = "warn"
nonminimal_bool = "warn"
overly_complex_bool_expr = "warn"
range_plus_one = "warn"
redundant_else = "warn"
return_self_not_must_use = "warn"
single_char_pattern = "warn"
stable_sort_primitive = "warn"
str_split_at_newline = "warn"
unicode_not_nfc = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_semicolon = "warn"
used_underscore_binding = "warn"
