[package]
name = "pa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The prime-agent binary."

[dependencies]
pa-types = { path = "../pa-types" }
pa-core = { path = "../pa-core" }
pa-ai = { path = "../pa-ai" }
pa-agent = { path = "../pa-agent" }
pa-daemon = { path = "../pa-daemon" }
pa-tui = { path = "../pa-tui" }
pa-telemetry = { path = "../pa-telemetry" }
uuid = { version = "1", features = ["v4", "v7"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "prime-agent"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
# The release-workflow test parses the CI workflow YAML and builds fixture
# tarballs/manifests for the promote-job layout gates (the same versions the
# workspace already resolves for pa-core's update/release seam).
serde_yaml = "0.9"
tar = "0.4"
flate2 = "1"
# The traces login tests encrypt the challenge result with the flow's own
# public key (same versions the workspace resolves for the engine).
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
libc = "0.2"
futures = { workspace = true }
crossterm = "0.28"
nix = { version = "0.29", features = ["term", "signal", "fs"] }
url = "2"

[lints.clippy]
redundant_clone = "warn"
clone_on_copy = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
duration_suboptimal_units = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
single_match_else = "warn"
needless_continue = "warn"
items_after_statements = "warn"
if_not_else = "warn"
semicolon_if_nothing_returned = "warn"
