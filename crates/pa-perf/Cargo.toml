# pa-perf: the performance corpus generator + bench harness (dev/CI tooling).
# Top of the dependency graph: nothing depends on it, and it never ships —
# the release lanes build only `-p pa-cli --bin prime-agent`.
[package]
name = "pa-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CLI parsing: the workspace already resolves clap for pa-tui; pa-perf adds
# no new third-party crates (make deny stays clean).
clap = { version = "4", features = ["derive"] }
# pty + poll for the bench harness: the same nix version the workspace
# already resolves for pa-core/pa-cli.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "signal", "process", "fs", "poll"] }

[dependencies.pa-types]
path = "../pa-types"

[dependencies.pa-core]
path = "../pa-core"

[dependencies.pa-daemon]
path = "../pa-daemon"

[dev-dependencies]
tempfile = "3"

# The library's rows/entries ride the product's own serializers (pa-types
# payloads inside pa-daemon's SessionEntry), so generated corpora exercise
# the exact wire format the product reads.
