name: Benchmark tooling

on:
  pull_request:
    paths: ['scripts/benchmarks/**', '.github/workflows/benchmark*.yml']
  push:
    branches: [main]
    paths: ['scripts/benchmarks/**', '.github/workflows/benchmark*.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install benchmark tooling
        run: |
          python3 -m venv .benchmark-bootstrap
          .benchmark-bootstrap/bin/pip install uv==0.12.9
          .benchmark-bootstrap/bin/uv sync --locked --project scripts/benchmarks
          echo "$PWD/.benchmark-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Validate benchmark harness
        working-directory: scripts/benchmarks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -m unittest discover -s tests -v
