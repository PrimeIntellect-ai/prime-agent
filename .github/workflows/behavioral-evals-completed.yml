name: Finalize Behavioral Eval

on:
  workflow_run:
    workflows: [Behavioral Eval]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: behavioral-eval-comment-${{ github.event.workflow_run.display_title }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Download trusted request
        id: request
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: behavioral-request-${{ github.event.workflow_run.run_attempt }}
          path: request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download behavioral result
        if: steps.request.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: behavioral-results-${{ github.event.workflow_run.run_attempt }}
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish the current result
        if: steps.request.outcome == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          REQUEST_PATH: request/request.json
          COMMENT_PATH: evidence/results/comment.md
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            if (run.path.split('@')[0] !== '.github/workflows/behavioral-evals.yml' ||
                run.repository.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error('Unexpected source workflow');
            }
            const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'));
            if (request.run_id !== run.id || request.attempt !== run.run_attempt ||
                request.repository !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Behavioral request does not match the completed workflow');
            }
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: request.pr,
            });
            const labeled = pull.data.labels.some(label => label.name === 'pre-release');
            if (pull.data.head.sha !== request.head_sha || !labeled) return;
            const marker = '<!-- prime-agent-behavioral-eval:v1 -->';
            let body;
            if (fs.existsSync(process.env.COMMENT_PATH)) {
              body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            } else {
              body = marker + '\n## Behavioral Eval\n\n' +
                'The labeled evaluation did not produce a valid report. ' +
                'See the workflow artifacts.';
            }
            if (!body.startsWith(marker) || body.length > 60000) {
              throw new Error('Behavioral report is malformed or too large');
            }
            body += `\n<!-- run:${request.run_id}:${request.attempt} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: request.pr,
              per_page: 100,
            });
            const prior = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker));
            if (prior) {
              const match = prior.body.match(/<!-- run:(\d+):(\d+) -->/);
              if (match) {
                const generation = [Number(match[1]), Number(match[2])];
                if (generation[0] > request.run_id ||
                    (generation[0] === request.run_id &&
                     generation[1] > request.attempt)) return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: request.pr,
                body,
              });
            }

      - name: Set up uv
        if: always()
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.12.9
          enable-cache: false

      - name: Install cleanup tooling
        if: always()
        run: uv sync --locked --project scripts/benchmarks

      - name: Delete sandboxes owned by this run
        if: always()
        continue-on-error: true
        run: |
          uv run --locked --project scripts/benchmarks python \
            scripts/behavioral-evals/cleanup.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --attempt "${{ github.event.workflow_run.run_attempt }}"
        env:
          PRIME_SANDBOX_API_KEY: ${{ secrets.PRIME_SANDBOX_API_KEY }}
          PRIME_TEAM_ID: ${{ vars.PRIME_BENCHMARK_TEAM_ID }}
