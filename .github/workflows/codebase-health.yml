# Codebase-health gate: the max-LOC ratchet (AGENTS.md).
#
# Keeps tracked Rust files from accreting past their ceilings: new files are
# held to the 500-line default ceiling, and every file already over it when
# the ratchet landed is frozen at its measured size in scripts/loc-baseline.json
# (a count that can only go down). Runs in seconds on the plain runner image:
# stdlib-only python3, no toolchain, no cache, no build. The local mirror is
# `make loc`.
#
# The gate exists to stop the port repeating the TS repo's giant-file failure
# mode (files that accrete features until they are unreviewable - the TS
# daemon-session-list / daemon-mode era) at mechanical-enforcement time
# rather than cleanup time: AGENTS.md's under-500 target predates this check
# and was never enforced, and the 2026-09-24 tip already holds files 20x
# over it (worker.rs 10992, agent_engine.rs 9838, session_ui.rs 9442).

name: codebase-health

on:
  push:
    branches:
      - main
      - rust
  pull_request:

permissions: {}

concurrency:
  group: codebase-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: LOC ratchet check
        run: python3 scripts/check_loc.py
