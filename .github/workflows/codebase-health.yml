# Non-blocking, PR-only guidance for files growing past 500 lines.
name: codebase-health
on:
  pull_request:
permissions:
  contents: read
jobs:
  loc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report growing Rust files over 500 lines
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          base = os.environ['BASE_SHA']
          git = ['git', '-C', str(root)]
          changed = subprocess.check_output(git + ['diff', '--name-only', '-z',
              '--diff-filter=ACMR', base, 'HEAD', '--', '*.rs']).split(b'\0')
          count = 0
          for raw in filter(None, changed):
              path = os.fsdecode(raw)
              if path == 'crates/pa-ai/src/models_generated.rs':
                  continue
              old = subprocess.run(git + ['show', f'{base}:{path}'],
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL).stdout
              before = len(old.splitlines())
              after = len((root / path).read_bytes().splitlines())
              if after > 500 and after > before:
                  count += 1
                  if count <= 10:
                      print(f'::warning file={path},line=1,title=File size guidance::'
                            f'{before} -> {after} lines; consider splitting this module')
          print(f'{count} changed Rust file(s) grew beyond 500 lines (guidance only).')
          PY
