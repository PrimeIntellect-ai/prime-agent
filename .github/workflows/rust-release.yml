# Coworker-facing release channel for the Rust product.
#
# The org repo's `v*` tag history (release.yml) stays owned by the merged
# TS product, and continuous.yml is the branch-push build channel; this
# workflow is the Rust product's own RELEASE channel: a `rust-v*` tag
# publishes the versioned tarballs + SHA256SUMS + manifest +
# install-rust.sh to a GitHub release. The `rust-v` prefix keeps the two
# products' release histories disjoint — the TS installers resolve `v*`
# tags, install-rust.sh resolves `rust-v*` tags, and neither ever sees
# the other's releases.
#
# Supply-chain shape (docs/RUST_QUICKSTART.md, RELEASE_SECURITY design):
# the builder and the publisher are separate jobs with separate tokens —
# the build jobs hold `contents: read` only (no release credential can
# reach them), and the publish job holds `contents: write` against the
# `rust-release` environment and NEVER checks out source: it receives
# only what the build jobs produced (tarballs, checksums, manifest, and
# the installer that travels with the release assets), re-verifies hash
# continuity against the build manifests, and attaches. A tag therefore
# publishes exactly the bytes that were built, from a tree the build
# jobs alone saw. The publish job is also the seam where signing and
# attestation slot in (SLSA provenance, SBOM, cosign) — marked inline.
#
# Unlike release.yml's promote stage (SBOM + provenance attestation,
# notarization reserved), this internal channel carries none of the
# supply-chain gates yet — it is the pragmatic internal baseline
# (checksums + build/publish separation + the deny audit), with the
# public-release upgrades documented as seams.
name: rust-release

on:
  push:
    tags:
      - "rust-v*"

permissions: {}

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tag-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
      - name: Validate tag matches workspace version
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || { echo "ref is not a tag"; exit 1; }
          tag_ver="${GITHUB_REF_NAME#rust-v}"
          cargo_ver="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ "${tag_ver}" == "${cargo_ver}" ]]             || { echo "tag rust-v${tag_ver} does not match Cargo.toml ${cargo_ver}"; exit 1; }
          echo "tag and workspace version agree (${tag_ver})"
      # The dependency audit gate: the release tree must pass the same
      # advisories + licenses check the branch channel runs (deny.toml);
      # the RLSA database is fetched at run time. SEAM: pin the advisory
      # DB snapshot (or vendor it) when we take the channel public.
      - name: Dependency audit (cargo-deny advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace
          command-arguments: advisories licenses

  build:
    needs: tag-check
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel  # macos-13 is retired; this is the Intel runner now
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
          # aarch64-linux and windows ship later (kept visible as rows);
          # install-rust.sh turns linux-arm64 users away with that exact
          # message instead of a guess:
          # - target: aarch64-unknown-linux-gnu
          #   runs-on: ubuntu-24.04-arm
          # - target: x86_64-pc-windows-msvc
          #   runs-on: windows-2022
    env:
      # AppleDouble resource forks must not leak into the archive; the
      # assembler additionally enforces plain-file payloads.
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0 action pin; toolchain pinned below
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Scoped to this pipeline so its restores never alias the
          # continuous channel's cache for the same targets.
          key: rust-release-${{ matrix.target }}
      # pa-cli pulls the whole product (its dependency edges reach every
      # crate), so -p pa-cli builds exactly the shipped binary; --locked
      # honors the committed lockfile — releases build exactly what was
      # reviewed.
      - name: Build (release, locked, pa-cli)
        run: cargo build --release --locked -p pa-cli --target ${{ matrix.target }} -j 4
      - name: Assemble tarball + checksums + manifest (commit-stamped)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${{ matrix.target }}/release/prime-agent" \
            --out-dir "target/${{ matrix.target }}/dist"
          cat "target/${{ matrix.target }}/dist/manifest.json"
      # The raw target binary answers the compile-time workspace version (no
      # exe-adjacent package.json in the cargo dir; the -continuous.<sha>
      # stamp lands in the tarball's staged package.json, which the binary
      # resolves once extracted). The answer must be non-empty and start with
      # the workspace version — the same value the release tag names — so the
      # shipped --version can never drift from the release that carries it.
      - name: "Smoke: --version answers"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/prime-agent"
          out="$("${bin}" --version)"
          [[ -n "${out}" ]]             || { echo "binary printed an empty --version"; exit 1; }
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ "${out}" == "${version}"* ]]             || { echo "binary reports '${out}', expected the workspace version ${version}"; exit 1; }
          echo "--version answered: ${out}"
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-build-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
            install-rust.sh
          if-no-files-found: error

  publish:
    needs: build
    name: publish release (rust-v tag)
    runs-on: ubuntu-latest
    # The publish/publish-build split (RELEASE_SECURITY): the publish job
    # holds the release credential against this environment — repo
    # settings can add required reviewers to it — and NEVER checks out
    # source: the release carries only what the build jobs produced. The
    # builder cannot publish (contents: read only) and the publisher
    # cannot build (no checkout, no toolchain, no secrets beyond the
    # scoped job token).
    environment: rust-release
    permissions:
      contents: write
      # SEAM (public-release): `id-token: write` joins here for
      # actions/attest-build-provenance (SLSA provenance over the
      # tarballs) — the slot sits after the hash-continuity gate below.
    timeout-minutes: 30
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
      - name: Verify hash continuity (artifacts match build-job manifests)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          incoming = pathlib.Path("incoming")
          failures = []
          installers = []
          # The upload artifact keeps the upload paths' shortest common
          # ancestor, so files may sit nested (target/<t>/dist/...) - every
          # lookup is a recursive search inside the row's artifact dir.
          for entry_dir in sorted(p for p in incoming.iterdir() if p.is_dir()):
              manifest_path = next(entry_dir.rglob("manifest.json"), None)
              if manifest_path is None:
                  failures.append(f"{entry_dir.name}: manifest.json missing")
                  continue
              manifest = json.loads(manifest_path.read_text())
              for b in manifest["binaries"]:
                  tar = next(entry_dir.rglob(b["file"]), None)
                  if tar is None:
                      failures.append(f"{b['file']}: missing")
                      continue
                  digest = hashlib.sha256(tar.read_bytes()).hexdigest()
                  if digest != b["sha256"]:
                      failures.append(f"{b['file']}: sha256 mismatch")
              installer = next(entry_dir.rglob("install-rust.sh"), None)
              if installer is None:
                  failures.append("install-rust.sh: missing from a build artifact")
              else:
                  installers.append(hashlib.sha256(installer.read_bytes()).hexdigest())
          # One installer per matrix row, byte-identical: a publisher that
          # received divergent copies refuses rather than picks one.
          if len(set(installers)) != 1:
              failures.append(f"install-rust.sh: divergent copies across build jobs")
          if failures:
              sys.exit("hash continuity failed:\n" + "\n".join(failures))
          print("hash continuity verified for all archives + the installer")
          PY
      - name: Flatten release assets (tarballs + merged checksums + manifest + installer)
        run: |
          set -euo pipefail
          mkdir release-out
          find incoming -name 'prime-agent-*.tar.gz' -exec cp {} release-out/ \;
          cp "$(find incoming -name install-rust.sh | head -n 1)" release-out/install-rust.sh
          # Merge the per-target SHA256SUMS + manifest.json (one sorted
          # pair per release) AND cover the installer itself: SHA256SUMS
          # is the single out-of-band integrity file the quickstart
          # verifies every download — the tarballs AND the script —
          # against. SEAM (public-release): a cosign sign-blob of
          # SHA256SUMS (keyless, OIDC-identity-bound) attaches beside it
          # here; the installer later verifies it with `cosign
          # verify-blob` when cosign is present.
          python3 - <<'PY'
          import json, pathlib, hashlib
          incoming = pathlib.Path("incoming")
          merged, sums, version = [], [], None
          for entry_dir in sorted(p for p in incoming.iterdir() if p.is_dir()):
              manifest = json.loads(next(entry_dir.rglob("manifest.json")).read_text())
              version = manifest["version"]
              merged.extend(manifest["binaries"])
              sums.extend(line for line in
                          next(entry_dir.rglob("SHA256SUMS")).read_text().splitlines()
                          if line.strip())
          merged.sort(key=lambda b: b["file"])
          sums.sort(key=lambda line: line.split(None, 1)[1])
          out = pathlib.Path("release-out")
          installer_digest = hashlib.sha256((out / "install-rust.sh").read_bytes()).hexdigest()
          sums.append(f"{installer_digest}  install-rust.sh")
          (out / "manifest.json").write_text(
              json.dumps({"version": version, "binaries": merged}, indent=2) + "\n")
          (out / "SHA256SUMS").write_text("\n".join(sums) + "\n")
          PY
          # SEAM (public-release): the SBOM slot — syft over the unpacked
          # payload (release.yml's promote does this) and/or
          # actions/attest-build-provenance over the tarballs go here,
          # after continuity and before attach.
          ls -la release-out
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # The TS v* releases own the repo's "latest" slot; a rust-v* tag
          # must not steal it (the TS installers point users at the TS
          # latest, and install-rust.sh resolves rust-v* releases itself).
          # NOT prerelease: the installer's default tag resolution prefers
          # stable releases, so marking these prerelease would hide them
          # from the default install.
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            release-out/prime-agent-*.tar.gz
            release-out/SHA256SUMS
            release-out/manifest.json
            release-out/install-rust.sh
