# Continuous build pipeline for Prime Agent (Rust).
#
# Builds the 4-target release matrix on every push to `main` and
# uploads the tarballs as workflow artifacts (downloadable from the run page).
# Does NOT create tags or releases — the org repo's release history stays
# owned by the merged product's release workflow (release.yml).
# No Rust toolchain needed on the consumer side: the kernel runtime sidecar
# ships inside every tarball.
#
name: continuous

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: continuous-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Superseded-push gate (TS #2567): with `cancel-in-progress: false`, every
  # push to main queues a full 4-target build, so a burst of merges
  # leaves older runs building artifacts for a commit that is no longer the
  # tip. The gate checks the live branch tip first: when the workflow commit
  # is superseded, the expensive build jobs skip (neutral exit) and the
  # newest push's run produces the artifacts. Fail-open: a failed tip lookup
  # builds as before. PR runs and tag-driven releases (release.yml) are
  # unaffected — this workflow only fires on branch pushes.
  staleness:
    # After `deny`: the tip lookup runs as late in the DAG as the builds
    # allow, so a push that lands while `deny` runs is still caught (the
    # check-then-build window shrinks to the build's own startup).
    needs: deny
    name: Superseded push check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      superseded: ${{ steps.tip.outputs.superseded }}
    steps:
      - name: Compare the workflow commit with the live branch tip
        id: tip
        run: |
          set -eu
          # Git-over-HTTPS wants Basic (x-access-token), not Bearer: a Bearer
          # header is answered with "invalid credentials" EVEN on a public
          # repo (an offered-but-bad credential 401s instead of serving
          # anonymously), which would swallow every lookup and no-op the
          # gate. The Basic form is verified working; empty tip builds as
          # before (fail-open).
          basic="$(printf 'x-access-token:%s' "${{ github.token }}" | base64 | tr -d '\n')"
          tip="$(git -c "http.extraheader=AUTHORIZATION: basic ${basic}" ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | cut -f1 || true)"
          if [ -n "${tip}" ] && [ "${tip}" != "${GITHUB_SHA}" ]; then
            echo "superseded=true" >> "${GITHUB_OUTPUT}"
            echo "superseded: ${GITHUB_SHA} is no longer the tip of ${GITHUB_REF_NAME} (tip ${tip}); the build jobs skip"
          else
            echo "superseded=false" >> "${GITHUB_OUTPUT}"
          fi

  # The dependency audit gate (RELEASE_SECURITY pragmatic baseline): the
  # same advisories + licenses check as `make deny` (deny.toml), on every
  # tree the branch channel builds binaries from. Advisories that are
  # triaged-unmaintained carry an `ignore` entry with the reason and a
  # review date (docs/installer-ci-design.md §7); the gate fails on
  # anything new. SEAM: pin the advisory-DB snapshot (or vendor it) when
  # the channel goes public.
  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency audit (cargo-deny advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace
          command-arguments: advisories licenses

  # The audit gates every build: an unaudited tree must not produce
  # downloadable branch-channel binaries.
  build-gnu:
    needs: [deny, staleness]
    if: needs.staleness.outputs.superseded != 'true'
    name: build-${{ matrix.target }}
    # Self-hosted Linux legs (docs/sandbox-runners.md): the prime-linux-*
    # labels resolve on Prime sandbox microVMs whose rootfs IS the same
    # digest-pinned Ubuntu 22.04 image (the reviewed GLIBC 2.35 build
    # baseline), so the baseline moves with the runner provision, not with
    # the job. The sandbox host only supplies
    # CPU. The sandbox fleet is x86_64-only today, so the arm64 target
    # cross-links on the x64 host and its livechecks run under qemu-user
    # binfmt; the host image stays the reviewed baseline either way.
    runs-on: ${{ matrix.runs-on }}
    # The runner rootfs is Ubuntu 22.04 (dash as /bin/sh); the steps pin bash.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: prime-linux-x64
          - target: aarch64-unknown-linux-gnu
            # Cross-compile leg: the GNU aarch64 toolchain (Ubuntu 22.04
            # sysroot, the same GLIBC 2.35 baseline) plus qemu-user so the
            # livechecks run the produced arm64 binary on the x64 host.
            runs-on: prime-linux-arm64
    env:
      # AppleDouble resource forks must not leak into the archive; the
      # assembler additionally enforces plain-file payloads.
      COPYFILE_DISABLE: "1"
      # Cross-compile leg (aarch64 target on the x86_64 host): cargo links
      # with the GNU cross toolchain, and the livecheck gates run the
      # produced arm64 binary under qemu-user binfmt with the cross sysroot
      # as the guest interpreter prefix. Harmless on the native x64 leg.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      # Job steps run as the sudo-less runner user, so the build packages,
      # the aarch64 cross toolchain, and the qemu binfmt handler are set up
      # as root by scripts/ci/register_runner.sh at provision time. This
      # step only fails fast when a runner was provisioned without them.
      - name: Check the runner provision
        run: |
          set -euo pipefail
          tools=(gcc curl python3 git objcopy)
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]]; then
            tools+=(aarch64-linux-gnu-gcc aarch64-linux-gnu-objcopy aarch64-linux-gnu-objdump)
            [[ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]] \
              || { echo "::error::qemu-aarch64 binfmt is not enabled; re-provision with scripts/ci/register_runner.sh"; exit 1; }
          fi
          for tool in "${tools[@]}"; do
            command -v "${tool}" >/dev/null \
              || { echo "::error::${tool} is missing; re-provision with scripts/ci/register_runner.sh"; exit 1; }
          done
      # clean: false keeps target/ (the warm cache) across builds; the next
      # step does the clean checkout would do, minus target/, and drops the
      # previous run's outputs so stale artifacts cannot be merged or uploaded.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          clean: false
      - name: Clean the workspace (keep the target/ cache)
        run: |
          set -euo pipefail
          git clean -ffdx -e /target/
          rm -rf "target/${{ matrix.target }}/dist" "target/${{ matrix.target }}/catalog-assets"
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input, and its parse step hard-codes 1.98.1. Change the
      # compiler by changing the SHA; a `toolchain:` input is ignored.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      # No rust-cache on the self-hosted legs: the runner VM persists
      # target/ across builds (the warm-build contract in
      # docs/sandbox-runners.md), so the disk is the cache and restoring a
      # stale tarball over a warm target dir would only regress
      # fingerprints. A freshly provisioned runner pays one cold build,
      # then stays warm for the life of the sandbox.
      # Only the shipped binary links here: the job packages `prime-agent`
      # alone, so pa-daemon's [[bin]] would be a second thin-LTO link with
      # no consumer (~26% of the build step, measured).
      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} -j 4 -p pa-cli --bin prime-agent
      - name: Split the shipped binary + split-debug decoder (Option C posture)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/split_debug.py \
            --binary "target/${{ matrix.target }}/release/prime-agent" \
            --shipped "target/${{ matrix.target }}/dist/prime-agent" \
            --out "target/${{ matrix.target }}/dist" \
            --version "${version}" \
            --target "${{ matrix.target }}"
      - name: "GLIBC baseline gate: no symbols above GLIBC_2.35 (Ubuntu 22.04)"
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/dist/prime-agent"
          # The cross leg reads its aarch64 ELF with the matching cross
          # binutils, like the split/assemble steps do.
          objdump=objdump
          [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]] && objdump=aarch64-linux-gnu-objdump
          syms="$("${objdump}" -T "${bin}" | grep -o 'GLIBC_[0-9.]*' || true)"
          if [ -z "${syms}" ]; then
            echo "::error::could not inspect ${bin} with ${objdump} (no GLIBC symbols found) - refusing to pass the gate without evidence"
            exit 1
          fi
          max_glibc="$(printf '%s\n' "${syms}" | sort -Vu | tail -1)"
          echo "highest GLIBC symbol required: ${max_glibc}"
          top="$(printf '%s\nGLIBC_2.35\n' "${max_glibc}" | sort -Vu | tail -1)"
          if [ "${top}" != "GLIBC_2.35" ]; then
            echo "::error::binary requires ${max_glibc}, above the GLIBC_2.35 (Ubuntu 22.04) release baseline"
            exit 1
          fi
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --fixture \
            --out "target/${{ matrix.target }}/catalog-assets"
      - name: Assemble tarball + checksums + manifest (commit-stamped)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${{ matrix.target }}/dist/prime-agent" \
            --decoder "target/${{ matrix.target }}/dist/prime-agent-${version}-$(case "${{ matrix.target }}" in x86_64*) echo linux-x64;; aarch64*) echo linux-arm64;; esac).debug.gz" \
            --catalog-assets "target/${{ matrix.target }}/catalog-assets" \
            --out-dir "target/${{ matrix.target }}/dist"
          cat "target/${{ matrix.target }}/dist/manifest.json"
      # The assembled artifact's livecheck runs on the build host: natively
      # on the x64 leg, under qemu-user binfmt on the cross arm64 leg
      # (QEMU_LD_PREFIX is set at the job level).
      - name: Livecheck the assembled continuous artifact on the build host
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/verify_release.py \
            --dist-dir "target/${{ matrix.target }}/dist" \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --sha "${GITHUB_SHA}"
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error

  build-darwin:
    needs: [deny, staleness]
    if: needs.staleness.outputs.superseded != 'true'
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
          # The x86_64 leg cross-compiles on the Apple-silicon pool: rustc
          # and the Xcode linker build either darwin arch from an M-series
          # host, and the M-pool links this binary ~2.2x faster than the
          # macos-15-intel pool with far tighter variance (484 s vs 1046 s
          # same-commit link tail, 2026-09-30). The livecheck below runs
          # the assembled x64 artifact under Rosetta 2 — the macos-15
          # arm64 image installs it, and install-rust.sh ships the x64
          # build to an Apple-Silicon Mac's Rosetta shell, so the gate
          # still boots the binary on its delivery runtime.
          - target: x86_64-apple-darwin
            runs-on: macos-15
    env:
      # AppleDouble resource forks must not leak into the archive; the
      # assembler additionally enforces plain-file payloads.
      COPYFILE_DISABLE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The pinned SHA is the toolchain pin: this action version has no
      # `toolchain` input, and its parse step hard-codes 1.98.1. Change the
      # compiler by changing the SHA; a `toolchain:` input is ignored.
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      # Only the shipped binary links here: the job packages `prime-agent`
      # alone, so pa-daemon's [[bin]] would be a second thin-LTO link with
      # no consumer (~26% of the build step, measured).
      - name: Build (release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} -j 4 -p pa-cli --bin prime-agent
      - name: Generate bundled catalog assets (fixture, offline-safe)
        run: |
          set -euo pipefail
          python3 scripts/release/bundle_catalog.py generate --fixture \
            --out "target/${{ matrix.target }}/catalog-assets"
      - name: Assemble tarball + checksums + manifest (commit-stamped)
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/assemble_artifacts.py \
            --repo-root . \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --sha "${GITHUB_SHA}" \
            --binary "target/${{ matrix.target }}/release/prime-agent" \
            --catalog-assets "target/${{ matrix.target }}/catalog-assets" \
            --out-dir "target/${{ matrix.target }}/dist"
          cat "target/${{ matrix.target }}/dist/manifest.json"
      # The livecheck extracts the tarball and runs the payload binary's
      # `--version` from a scratch cwd (verify_release.py). The aarch64 leg
      # executes it natively; the x86_64 leg, cross-compiled on the
      # Apple-silicon pool, executes it under Rosetta 2 — the runtime the
      # x64 payload runs on for an Apple-Silicon Mac customer, so the gate
      # still boots the artifact on its delivery runtime.
      - name: Livecheck the assembled continuous artifact on its build runner
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [[ -n "${version}" ]] || { echo "could not read the workspace version"; exit 1; }
          python3 scripts/release/verify_release.py \
            --dist-dir "target/${{ matrix.target }}/dist" \
            --version "${version}" \
            --target "${{ matrix.target }}" \
            --sha "${GITHUB_SHA}"
      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/dist/prime-agent-*
            target/${{ matrix.target }}/dist/SHA256SUMS
            target/${{ matrix.target }}/dist/manifest.json
          if-no-files-found: error
