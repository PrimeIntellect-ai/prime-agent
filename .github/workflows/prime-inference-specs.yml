# Daily report of Prime Inference models whose /models entry lacks specs
# (prime-agent drops them from its catalog). A separate workflow that no
# branch protection requires: it fails red on upstream data, which must not
# block continuous, nightly, or release runs.
name: Prime Inference specs

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/prime_inference_specs.py
