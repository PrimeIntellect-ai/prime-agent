title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing Discussions first and do not include API keys, tokens, private prompts, or other sensitive information.

        If this may be a security vulnerability, stop and follow the private reporting instructions in SECURITY.md instead.
  - type: dropdown
    id: package
    attributes:
      label: Affected area
      description: Which part of Prime Agent is affected?
      multiple: true
      options:
        - Agent core
        - AI providers and models
        - Coding agent and CLI
        - TUI
        - Installation or updates
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Run `prime-agent ...`
        2. ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prime Agent version
      description: Include the output of `prime-agent --version`, or the commit SHA when running from source.
      placeholder: "e.g. 0.9.1 or 81ae3cb"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      description: How was this Prime Agent version installed?
      options:
        - Stable release installer
        - Beta release installer
        - npm package
        - From source
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows Subsystem for Linux (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating system version
      description: Include the exact release or build. For WSL, include both the distribution and Windows version.
      placeholder: "e.g. macOS 15.6, Ubuntu 24.04, or Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      description: Use `uname -m`, or `$env:PROCESSOR_ARCHITECTURE` in PowerShell, if unsure.
      options:
        - arm64 / aarch64
        - x86_64 / amd64
        - Other
    validations:
      required: true
  - type: input
    id: shell_terminal
    attributes:
      label: Shell and terminal
      description: Include both the shell and terminal application where the problem occurred.
      placeholder: "e.g. zsh 5.9 in Terminal.app or PowerShell 7.5 in Windows Terminal"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, or related Discussions if useful.
    validations:
      required: false
