---
name: Accepted feature (maintainers)
description: Track a feature accepted from GitHub Discussions
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are the maintainer work queue. If a maintainer has not asked you to create this Issue, use the Feature request form in GitHub Discussions instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see happen, and any ideas for how it could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, mockups, or examples.
    validations:
      required: false
