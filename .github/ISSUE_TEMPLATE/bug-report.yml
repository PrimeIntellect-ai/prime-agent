---
name: Accepted bug (maintainers)
description: Track a bug accepted from GitHub Discussions
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are the maintainer work queue. If a maintainer has not asked you to create this Issue, use the Bug report form in GitHub Discussions instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reliably reproduce the issue.
      placeholder: |
        1. Run `prime-agent ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages, logs, or screenshots if possible. Redact API keys, tokens, and other secrets before pasting.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prime Agent version
      description: Output of `prime-agent --version`.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, configuration, or environment details. Redact secrets before sharing.
    validations:
      required: false
