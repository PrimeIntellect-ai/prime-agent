---
name: Accepted bug (maintainers)
description: Track a bug accepted from GitHub Discussions
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are the maintainer work queue. If a maintainer has not asked you to create this Issue, use the Bug report form in GitHub Discussions instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reliably reproduce the issue.
      placeholder: |
        1. Run `prime-agent ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages, logs, or screenshots if possible. Redact API keys, tokens, and other secrets before pasting.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prime Agent version
      description: Output of `prime-agent --version`, or the commit SHA when running from source.
      placeholder: "e.g. 0.9.1 or 81ae3cb"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      description: How was this Prime Agent version installed?
      options:
        - Stable release installer
        - Beta release installer
        - npm package
        - From source
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows Subsystem for Linux (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Operating system version
      description: Include the exact release or build. For WSL, include both the distribution and Windows version.
      placeholder: "e.g. macOS 15.6, Ubuntu 24.04, or Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      description: Use `uname -m`, or `$env:PROCESSOR_ARCHITECTURE` in PowerShell, if unsure.
      options:
        - arm64 / aarch64
        - x86_64 / amd64
        - Other
    validations:
      required: true
  - type: input
    id: shell_terminal
    attributes:
      label: Shell and terminal
      description: Include both the shell and terminal application where the problem occurred.
      placeholder: "e.g. zsh 5.9 in Terminal.app or PowerShell 7.5 in Windows Terminal"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, configuration, or environment details. Redact secrets before sharing.
    validations:
      required: false
