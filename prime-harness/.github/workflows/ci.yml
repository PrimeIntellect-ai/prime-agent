name: Prime Harness full suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shell: [bash, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Validate Bash launcher syntax
        if: matrix.shell == 'bash'
        run: bash -n template/harness/burst.sh
      - name: Validate PowerShell launcher syntax
        if: matrix.shell == 'pwsh'
        run: $null = [scriptblock]::Create((Get-Content -Raw template/harness/burst.ps1))
      - name: Run the full standalone suite
        run: python -m pytest -q tests
