[project]
name = "harness-orchestrator"
version = "0.1.0"
description = "Prime harness: disciplined delegation, task state, admission policy, refinement governance"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_orchestrator"]
