[project]
name = "sci-verify"
version = "0.1.0"
description = "Prime harness: deterministic scientific verification oracles"
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3",
    "hypothesis>=6.100",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sci_verify"]
