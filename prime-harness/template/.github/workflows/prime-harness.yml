name: Prime Harness public gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gates:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [default, holdout]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install public gate dependencies
        run: >-
          python -m pip install
          pytest==8.4.1
          hypothesis==6.136.6
          PyYAML==6.0.2
          sympy==1.14.0
      - name: Install project when it is a Python package
        run: |
          if [[ -f pyproject.toml || -f setup.py || -f setup.cfg ]]; then
            python -m pip install -e .
          fi
      - name: Doctor preflight
        run: python harness/doctor.py
      - name: Run existing ${{ matrix.profile }} profile
        run: python harness/verify.py --profile "${{ matrix.profile }}" --json
