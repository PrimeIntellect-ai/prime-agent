name: Prime Harness public gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-gates:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [default, holdout]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve explicit gate diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request && -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
            if [[ "$base" == "$(git rev-parse HEAD)" ]] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^)"
            fi
          fi
          test -n "$base"
          git cat-file -e "$base^{commit}"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install public gate dependencies
        run: >-
          python -m pip install
          pytest==8.4.1
          hypothesis==6.136.6
          PyYAML==6.0.2
          sympy==1.14.0
      - name: Install project when it is a Python package
        run: |
          if [[ -f pyproject.toml || -f setup.py || -f setup.cfg ]]; then
            python -m pip install -e .
          fi
      - name: Run installed harness component self-tests
        run: python -m pytest -q .prime/agent/harness-tests/tests
      - name: Doctor preflight
        run: python harness/doctor.py
      - name: Run existing ${{ matrix.profile }} profile
        run: >-
          python harness/verify.py --profile "${{ matrix.profile }}"
          --base "${{ steps.diff-base.outputs.base }}" --json
