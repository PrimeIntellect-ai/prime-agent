[project]
name = "prime-agent-skill-computer-use"
version = "0.1.0"
description = "Observe and operate native desktop apps through the Prime Agent computer-use skill."
requires-python = ">=3.11"
dependencies = [
    "prime-agent-runtime",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.scripts]
computer_use = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.hatch.build.targets.wheel.force-include]
"references/app-instructions" = "computer_use/references/app-instructions"
