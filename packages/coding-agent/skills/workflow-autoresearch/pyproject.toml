# Kernel-side package for the bundled native AutoResearch facade. The host
# owns experiment state and effects; this package only calls rlm.host_request.
[project]
name = "autoresearch"
version = "0.1.0"
description = "Prime Agent native AutoResearch evidence facade over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoresearch"]
