[project]
name = "prime-agent-skill-linear"
version = "0.1.0"
description = "Linear integration skill for Prime Agent (Linear's official MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear"]
