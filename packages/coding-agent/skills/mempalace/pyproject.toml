# Kernel-side package for the bundled native MemPalace facade. The host owns
# canonical knowledge and optional index state; this package only calls
# rlm.host_request.
[project]
name = "mempalace"
version = "0.1.0"
description = "Prime Agent native MemPalace canonical knowledge facade over the host bridge"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mempalace"]
